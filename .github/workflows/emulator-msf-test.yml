# Runs an msf bundle on Android emulators the way the app does (install layout + the
# app's post-install patches, msfrpcd with the app's command and env, RPC calls):
# scripts/emulator-msf-test.sh. Free x86_64 runner with KVM; the google_apis x86_64
# images run the bundle's aarch64 binaries through their ARM translation
# (libndk_translation). Called by bundle-build.yml for every msf build (so nothing is
# published or merged unless it passes) and by emulator-msf-release.yml. Publishes nothing.
name: Emulator msf test

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact (of this run) holding ruby-msf-bundle.tar.gz.bin
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Android 14 only: on the Android 11 image the ARM translator crashed the
        # bundle's Ruby with "Illegal instruction" (thread in timeout.rb) after msfrpcd
        # had started; the same binary passes on 14 (run 43205082747).
        api-level: [34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run msfrpcd on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          script: strix/scripts/emulator-msf-test.sh "$(find bundle -name ruby-msf-bundle.tar.gz.bin -print -quit)" 2400
